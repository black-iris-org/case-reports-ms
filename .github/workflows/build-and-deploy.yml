name: Case Reports Build and Deployment

on:
  workflow_dispatch:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      slack_ts: ${{ steps.slack_start_deploy.outputs.ts }}
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

    services:
      postgres:
        image: postgis/postgis:10-2.5-alpine
        env:
          POSTGRES_USER: db
          POSTGRES_DB: db
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: satantime/minio-server
        env:
          MINIO_ROOT_USER: access_key
          MINIO_ROOT_PASSWORD: secret_key

    steps:
      - name: Notify Slack - Deploy Started
        id: slack_start_deploy
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            ENVIRONMENT="Production"
          else
            ENVIRONMENT="Staging"
          fi
          
          if [ -n "$PR_URL" ]; then
            PR_VALUE="<$PR_URL|#$PR_NUMBER $PR_TITLE>"
          else
            PR_VALUE="_direct push — no PR_"
          fi
          
          PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg env "$ENVIRONMENT" \
            --arg pr "$PR_VALUE" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            '{
              channel: $channel,
              text: "*\($env) deploy started*",
              attachments: [{
                color: "#d4a017",
                mrkdwn_in: ["fields"],
                fields: [
                  {title: "PR",          value: $pr,     short: false},
                  {title: "Branch",      value: $branch, short: true},
                  {title: "Triggered by",value: $actor,  short: true}
                ]
              }]
            }')
          
          RESPONSE=$(curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          echo "ts=$(echo "$RESPONSE" | jq -r '.ts')" >> "$GITHUB_OUTPUT"

      - name: Prepare Variables
        env:
          DOCKER_IMAGE_NAME: case-reports-ms
        run: |
          set -e
          IMAGE_NAME=docker.io/${{secrets.DOCKER_USERNAME}}/$DOCKER_IMAGE_NAME
          IMAGE_TAG=${GITHUB_REF_NAME//\//_}
          echo "export IMAGE_NAME=$IMAGE_NAME" > variables.txt
          echo "export IMAGE_TAG=$IMAGE_TAG" >> variables.txt
          cat variables.txt

      - name: Upload Variables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: variables
          path: variables.txt

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Variables Artifacts
        uses: actions/download-artifact@v4
        with:
          name: variables
          path: ./

      - name: Build Docker Image
        run: |
          set -e
          source variables.txt
          export DOCKER_BUILDKIT=1
          echo ${{secrets.DOCKER_PASSWORD}} | docker login -u ${{secrets.DOCKER_USERNAME}} --password-stdin
          ./.docker/build-base.sh
          ./.docker/build-app-image.sh
          ./.docker/copy-bundle-cache.sh
          docker save --output image.docker $IMAGE_NAME:$IMAGE_TAG

      - name: Cache Docker Layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Cache Bundle Dependencies
        uses: actions/cache@v3
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock', '**/*.gemspec') }}

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.docker

      - name: Set up Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Load Docker image
        run: docker load --input ./image.docker

      - name: Push Docker image
        run: |
          set -e
          source variables.txt
          docker push $IMAGE_NAME:$IMAGE_TAG

  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      DATABASE_USER: db
      DATABASE_PASSWORD: secret
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    services:
      postgres:
        image: postgres:15.1-alpine
        ports:
          - '9000:5432'
        env:
          POSTGRES_USER: db
          POSTGRES_DB: db
          POSTGRES_PASSWORD: secret
      minio:
        image: satantime/minio-server
        ports:
          - '9001:9000'
        env:
          MINIO_ACCESS_KEY: access_key
          MINIO_SECRET_KEY: secret_key

    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ./

      - name: Load Docker Image
        run: docker load --input ./image.docker

      - name: Download Variables Artifacts
        uses: actions/download-artifact@v4
        with:
          name: variables
          path: ./

      - name: Create .env File
        run: |
          cat <<ENV > .env
          RAILS_ENV=test
          PGDATABASE=db
          PGUSER=db
          PGPASSWORD=secret
          PGHOST=localhost
          DB_USER=db
          DB_HOST=localhost
          DB_PORT=9000
          DATABASE_PORT=9000
          DB_PASSWORD=secret
          AWS_ACCESS_KEY_ID=access_key
          AWS_SECRET_ACCESS_KEY=secret_key
          AWS_DEFAULT_REGION=us-east-1
          AWS_BUCKET_NAME=beacon-uploads-staging
          AWS_BUCKET=beacon-uploads-staging
          AWS_REGION=us-east-1
          S3_ENDPOINT=http://minio:9001
          PUBLIC_ID_CIPHER_KEY=ci-test-public-id-cipher-key-0123456789
          IMAGE_NAME=$IMAGE_NAME
          IMAGE_TAG=$IMAGE_TAG
          t=1
          ENV

      - name: Run Tests
        run: |
          set -e
          source variables.txt
          docker run --env-file .env\
               --network "host" \
               $IMAGE_NAME:$IMAGE_TAG \
               bash -c "bundle exec rails db:create db:schema:load && bundle exec rspec"

    notify:
      needs: [ build, test ]
      if: always()
      runs-on: ubuntu-latest
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      steps:
        - name: Notify Slack - Deploy Result
          env:
            SLACK_TS: ${{ needs.build.outputs.slack_ts }}
            BUILD_RESULT: ${{ needs.build.result }}
            TEST_RESULT: ${{ needs.test.result }}
          run: |
            set -euo pipefail

            if [ "$BUILD_RESULT" = "success" ] && [ "$TEST_RESULT" = "success" ]; then
              COLOR="#36a64f"
              STATUS=":white_check_mark: *Deploy succeeded*"
            else
              COLOR="#d00000"
              STATUS=":x: *Deploy failed*"
            fi

            PAYLOAD=$(jq -n \
              --arg channel "$SLACK_CHANNEL_ID" \
              --arg thread "$SLACK_TS" \
              --arg status "$STATUS" \
              --arg color "$COLOR" \
              --arg build "$BUILD_RESULT" \
              --arg test "$TEST_RESULT" \
              '{
                channel: $channel,
                text: $status,
                attachments: [{
                  color: $color,
                  mrkdwn_in: ["fields"],
                  fields: [
                    {title: "Build", value: $build, short: true},
                    {title: "Test",  value: $test,  short: true}
                  ]
                }]
              }
              + (if $thread != "" then {thread_ts: $thread} else {} end)')

            curl -s -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"